<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Countdown</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Hind+Siliguri:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #050505;
            color: #ffffff;
            overflow: hidden;
        }

        .font-mono-digits {
            font-family: 'JetBrains Mono', monospace;
        }

        .font-arabic {
            font-family: 'Amiri', serif;
        }

        /* Glassmorphism card effect */
        .glass-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        /* Smooth transition for quotes fade in/out */
        .quote-fade {
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
        }

        .quote-hidden {
            opacity: 0;
            transform: translateY(10px);
        }

        .quote-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Ambient glowing effect background */
        .glow-bg {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center relative select-none bg-black text-white px-4">

    <!-- Subtle Background Ambient Glows -->
    <div class="glow-bg top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
    <div class="glow-bg bottom-10 left-1/2 -translate-x-1/2"></div>

    <!-- Header Section (Top Spacer) -->
    <header class="pt-8 text-center z-10 opacity-40 hover:opacity-100 transition-opacity duration-300">
        <h2 class="text-xs tracking-[0.3em] uppercase text-gray-400 font-semibold">Official Result Countdown</h2>
    </header>

    <!-- Main Content Container -->
    <main class="flex flex-col items-center justify-center w-full max-w-4xl z-10 my-auto">
        
        <!-- Rotating Verses Display Container -->
        <div class="h-28 sm:h-32 flex items-center justify-center text-center px-6 w-full mb-6">
            <div id="verse-container" class="quote-fade quote-visible flex flex-col items-center justify-center">
                <p id="verse-text" class="text-2xl sm:text-3xl md:text-4xl text-gray-200 font-medium leading-relaxed">
                    <!-- Verse inserted via JavaScript -->
                </p>
                <span id="verse-sub" class="text-xs sm:text-sm text-gray-500 mt-2 tracking-wider">
                    <!-- Subtitle/Translation inserted via JS -->
                </span>
            </div>
        </div>

        <!-- Timer Display Box -->
        <div class="glass-box rounded-3xl p-6 sm:p-10 md:p-12 w-full max-w-3xl flex flex-col items-center justify-center relative overflow-hidden">
            <!-- Subtle edge light -->
            <div class="absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>

            <!-- Countdown Digits Grid -->
            <div class="grid grid-cols-3 gap-3 sm:gap-6 md:gap-8 w-full text-center">
                
                <!-- Hours Column -->
                <div class="flex flex-col items-center">
                    <div class="w-full py-4 sm:py-6 bg-white/5 rounded-2xl border border-white/5 flex justify-center items-center">
                        <span id="hours" class="font-mono-digits text-4xl sm:text-7xl md:text-8xl font-bold tracking-tight text-white drop-shadow-md">00</span>
                    </div>
                    <span class="text-xs sm:text-sm uppercase tracking-widest text-gray-400 mt-3 font-medium">ঘণ্টা</span>
                </div>

                <!-- Minutes Column -->
                <div class="flex flex-col items-center">
                    <div class="w-full py-4 sm:py-6 bg-white/5 rounded-2xl border border-white/5 flex justify-center items-center">
                        <span id="minutes" class="font-mono-digits text-4xl sm:text-7xl md:text-8xl font-bold tracking-tight text-white drop-shadow-md">00</span>
                    </div>
                    <span class="text-xs sm:text-sm uppercase tracking-widest text-gray-400 mt-3 font-medium">মিনিট</span>
                </div>

                <!-- Seconds Column -->
                <div class="flex flex-col items-center">
                    <div class="w-full py-4 sm:py-6 bg-white/5 rounded-2xl border border-white/5 flex justify-center items-center">
                        <span id="seconds" class="font-mono-digits text-4xl sm:text-7xl md:text-8xl font-bold tracking-tight text-white/90 drop-shadow-md">00</span>
                    </div>
                    <span class="text-xs sm:text-sm uppercase tracking-widest text-gray-400 mt-3 font-medium">সেকেন্ড</span>
                </div>

            </div>

            <!-- Status Indicator -->
            <div class="mt-8 flex items-center space-x-2">
                <span class="relative flex h-2 w-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span id="target-info" class="text-xs text-gray-400 font-light tracking-wide">টার্গেট সময়: বেলা ১১:০০ টা</span>
            </div>
        </div>

    </main>

    <!-- Extremely Subtle Bottom Footer Links -->
    <footer class="pb-3 pt-2 text-center z-10 w-full opacity-20 hover:opacity-80 transition-opacity duration-500">
        <div class="flex flex-wrap justify-center items-center gap-4 text-[10px] sm:text-xs text-gray-500 tracking-wider">
            <a href="https://www.educationboardresults.gov.bd/v2/home" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="hover:text-gray-300 transition-colors duration-200">
                EDUCATION BOARD Server
            </a>
            <span class="text-gray-700">•</span>
            <a href="https://result.dhakaeducationboard.gov.bd/v2/home" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="hover:text-gray-300 transition-colors duration-200">
                Dhaka Board Server
            </a>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // List of rotating verses/ayats
        const verses = [
            {
                text: "حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ",
                sub: "আমাদের জন্য আল্লাহ্‌ই যথেষ্ট, তিনি কতই না উত্তম কর্মবিধায়ক",
                isArabic: true
            },
            {
                text: "يَا فَتَّاحُ",
                sub: "হে পরম বিজয়দানকারী / উন্মুক্তকারী",
                isArabic: true
            },
            {
                text: "আর অচিরেই আপনার রব আপনাকে অনুগ্রহ দান করবেন, ফলে আপনি সন্তুষ্ট হবেন।",
                sub: "সূরা আদ-দুহা: ৫",
                isArabic: false
            }
        ];

        let currentVerseIndex = 0;

        const verseContainer = document.getElementById('verse-container');
        const verseText = document.getElementById('verse-text');
        const verseSub = document.getElementById('verse-sub');

        // Function to update the displayed verse with smooth fade effect
        function updateVerse() {
            verseContainer.classList.remove('quote-visible');
            verseContainer.classList.add('quote-hidden');

            setTimeout(() => {
                const current = verses[currentVerseIndex];
                verseText.textContent = current.text;
                verseSub.textContent = current.sub;

                if (current.isArabic) {
                    verseText.classList.add('font-arabic');
                } else {
                    verseText.classList.remove('font-arabic');
                }

                verseContainer.classList.remove('quote-hidden');
                verseContainer.classList.add('quote-visible');

                currentVerseIndex = (currentVerseIndex + 1) % verses.length;
            }, 1000); // Wait 1 sec for fade out before changing text
        }

        // Initialize verse display and set loop (Every 6 seconds)
        updateVerse();
        setInterval(updateVerse, 6000);

        // Countdown Logic
        function getTargetTime() {
            const now = new Date();
            const target = new Date();

            target.setHours(11, 0, 0, 0); // Target 11:00:00 AM

            // If it's already past 11:00 AM today, set target to 11:00 AM tomorrow
            if (now >= target) {
                target.setDate(target.getDate() + 1);
            }

            return target;
        }

        let targetTime = getTargetTime();

        function updateCountdown() {
            const now = new Date();
            let diff = targetTime - now;

            // If countdown finishes, reset target for next day 11:00 AM
            if (diff <= 0) {
                targetTime = getTargetTime();
                diff = targetTime - now;
            }

            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        // Run immediately and update every second
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
