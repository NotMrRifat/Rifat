<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>
    <linearGradient id="neonPurp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bd00ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8c291"/>
      <stop offset="50%" stop-color="#e77f67"/>
      <stop offset="100%" stop-color="#cf6a4c"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e272e"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="cyberGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 245, 255, 0.12)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  <rect width="500" height="500" fill="url(#cyberGrid)"/>

  <!-- Cyber Neon Rings / Halo -->
  <circle cx="250" cy="220" r="180" fill="none" stroke="url(#neonPurp)" stroke-width="2" opacity="0.4" stroke-dasharray="10 15"/>
  <circle cx="250" cy="220" r="160" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" opacity="0.6"/>
  <circle cx="250" cy="220" r="140" fill="none" stroke="#00f5ff" stroke-width="3" opacity="0.8" filter="url(#neonGlow)"/>

  <!-- Background Cyber HUD markings -->
  <g opacity="0.7" font-family="'Share Tech Mono', monospace" font-size="10" fill="#00f5ff">
    <text x="35" y="60">SYS://ALTER_EGO_MATRIX</text>
    <text x="35" y="75">AI_NEURAL_CORE: ACTIVE</text>
    <text x="340" y="60">LATENCY: 0.14ms</text>
    <text x="340" y="75">SYNC: 100% [CYBER]</text>
    <path d="M 40 40 L 70 40 L 70 45" fill="none" stroke="#00f5ff" stroke-width="2"/>
    <path d="M 460 40 L 430 40 L 430 45" fill="none" stroke="#00f5ff" stroke-width="2"/>
    <path d="M 40 460 L 70 460 L 70 455" fill="none" stroke="#00f5ff" stroke-width="2"/>
    <path d="M 460 460 L 430 460 L 430 455" fill="none" stroke="#00f5ff" stroke-width="2"/>
  </g>

  <!-- Character Silhouette & Body -->
  <!-- Hoodie Base -->
  <path d="M 100 500 C 100 400 130 350 180 320 L 220 380 L 250 395 L 280 380 L 320 320 C 370 350 400 400 400 500 Z" fill="url(#hoodieGrad)"/>
  
  <!-- Cyber Hoodie Seams & Circuit Glow -->
  <path d="M 180 320 L 220 380 L 225 500" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" filter="url(#neonGlow)"/>
  <path d="M 320 320 L 280 380 L 275 500" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" filter="url(#neonGlow)"/>
  <path d="M 140 420 L 170 450 L 170 500" fill="none" stroke="url(#neonPurp)" stroke-width="2"/>
  <path d="M 360 420 L 330 450 L 330 500" fill="none" stroke="url(#neonPurp)" stroke-width="2"/>

  <!-- Neck -->
  <path d="M 220 280 L 220 350 L 280 350 L 280 280 Z" fill="#cf6a4c"/>

  <!-- Head Base -->
  <path d="M 175 190 C 175 290 200 330 250 330 C 300 330 325 290 325 190 C 325 120 300 110 250 110 C 200 110 175 120 175 190 Z" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <path d="M 165 195 C 160 180 160 220 175 225 Z" fill="#cf6a4c"/>
  <path d="M 335 195 C 340 180 340 220 325 225 Z" fill="#cf6a4c"/>
  <!-- Cyber Earphone / Headset Piece -->
  <rect x="156" y="195" width="10" height="25" rx="3" fill="#00f5ff" filter="url(#neonGlow)"/>
  <circle cx="161" cy="207" r="2" fill="#fff"/>
  <rect x="334" y="195" width="10" height="25" rx="3" fill="#bd00ff" filter="url(#neonGlow)"/>
  <circle cx="339" cy="207" r="2" fill="#fff"/>

  <!-- Hair / Styled Cyber Cut -->
  <path d="M 165 170 C 160 130 185 85 240 85 C 295 85 335 110 335 160 C 335 170 320 150 310 150 C 295 130 270 120 240 125 C 210 130 190 150 175 175 Z" fill="#111625"/>
  <!-- Neon Hair Highlights -->
  <path d="M 185 140 C 210 100 260 95 305 115" fill="none" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)"/>
  <path d="M 205 120 C 235 90 280 90 315 125" fill="none" stroke="url(#neonPurp)" stroke-width="2" stroke-linecap="round"/>

  <!-- Eyebrows -->
  <path d="M 195 180 Q 220 172 235 182" fill="none" stroke="#0a0e17" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 305 180 Q 280 172 265 182" fill="none" stroke="#0a0e17" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Cyber Visor / High-Tech Futuristic Glasses -->
  <g filter="url(#neonGlow)">
    <polygon points="180,188 320,188 305,225 250,220 195,225" fill="rgba(0, 245, 255, 0.45)" stroke="#00f5ff" stroke-width="2.5"/>
    <line x1="180" y1="192" x2="320" y2="192" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <!-- Visor Telemetry Data -->
    <line x1="200" y1="205" x2="230" y2="205" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <circle cx="236" cy="205" r="2" fill="#ffffff"/>
    <text x="260" y="210" font-family="'Share Tech Mono', monospace" font-size="8" fill="#ffffff" opacity="0.9">AI:99%</text>
  </g>

  <!-- Nose -->
  <path d="M 247 225 L 243 252 L 253 252" fill="none" stroke="#a34f35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Confident Smile / Mouth -->
  <path d="M 228 275 Q 250 288 272 275" fill="none" stroke="#2c1a14" stroke-width="3" stroke-linecap="round"/>

  <!-- Cybernetic Facial Line / Circuit Markings -->
  <path d="M 285 240 L 305 245 L 310 265" fill="none" stroke="#00f5ff" stroke-width="1.5" opacity="0.8"/>
  <circle cx="310" cy="265" r="2" fill="#00f5ff" filter="url(#neonGlow)"/>

  <!-- Floating Holographic Code Rings Around Character -->
  <g font-family="'Share Tech Mono', monospace" font-size="11" fill="#00f5ff" opacity="0.85">
    <text x="75" y="310">&lt;CODING_TASTE&gt;</text>
    <text x="325" y="310">&lt;VIBE_ENGINEER&gt;</text>
  </g>
  <rect x="68" y="296" width="112" height="18" fill="none" stroke="#00f5ff" stroke-width="1" rx="3" opacity="0.6"/>
  <rect x="318" y="296" width="118" height="18" fill="none" stroke="#bd00ff" stroke-width="1" rx="3" opacity="0.6"/>
</svg>
